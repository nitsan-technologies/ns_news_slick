services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  NITSAN\NsNewsSlick\:
    resource: '../Classes/*'

  NITSAN\NsNewsSlick\Event\PageLayoutView:
    tags:
      - name: event.listener
        identifier: 'ns-news-slick-flexform-process'
        event: TYPO3\CMS\Backend\View\Event\PageContentPreviewRenderingEvent

  NITSAN\NsNewsSlick\EventListener\PremiumStripPreview:
    tags:
      - name: event.listener
        identifier: 'ns-news-slick/premium-strip-preview'
        event: TYPO3\CMS\Backend\View\Event\PageContentPreviewRenderingEvent
        after: 'ns-news-slick-flexform-process'
